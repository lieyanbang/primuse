name: iOS Device Unsigned Build

on:
  push:
    paths:
      - .github/workflows/ios-music-haptics-preflight.yml
      - project.yml
      - Primuse/**
      - PrimuseTests/**
      - PrimuseMacTests/**
      - PrimuseKit/**
      - PrimuseWidgetExtension/**
      - PrimuseKaraokeModelDownloader/**
      - PrimuseWatch/**
      - PrimuseWatchWidgets/**
      - PrimuseWatchShared/**
      - Frameworks/**
      - Config/**
      - SiriVocabulary/**
      - Vendor/LibNFS/**
      - Primuse.xcodeproj/**
      - scripts/**
  pull_request:
    paths:
      - .github/workflows/ios-music-haptics-preflight.yml
      - project.yml
      - Primuse/**
      - PrimuseTests/**
      - PrimuseMacTests/**
      - PrimuseKit/**
      - PrimuseWidgetExtension/**
      - PrimuseKaraokeModelDownloader/**
      - PrimuseWatch/**
      - PrimuseWatchWidgets/**
      - PrimuseWatchShared/**
      - Frameworks/**
      - Config/**
      - SiriVocabulary/**
      - Vendor/LibNFS/**
      - Primuse.xcodeproj/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-device-unsigned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Debug iOS Device build (unsigned)
    # This project uses SwiftUI ToolbarOverflowMenu behind an iOS 27 availability guard.
    # Xcode 26 cannot compile the declaration; pin the SDK generation that provides it.
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      XCODE_PATH: /Applications/Xcode_27.0.0.app
      XCODE_VERSION: "27.0"
      XCODE_BUILD: "27A266a"
      IOS_SDK_VERSION: "27.0"
      XCODEGEN_VERSION: "2.44.1"
      XCODEGEN_SHA256: a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73
    steps:
      - name: Checkout complete source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false

      - name: Select and report Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          grep -Fq "Xcode $XCODE_VERSION" "$RUNNER_TEMP/xcode-version.txt"
          grep -Fq "Build version $XCODE_BUILD" "$RUNNER_TEMP/xcode-version.txt"
          printf 'macOS: '; sw_vers -productVersion
          printf 'Runner architecture: '; uname -m
          printf 'Swift: '; swift --version | head -n 1
          ios_sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          printf 'iOS SDK: %s\n' "$ios_sdk"
          test "$ios_sdk" = "$IOS_SDK_VERSION"
          xcodebuild -showsdks

      - name: Install checksum-verified XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}.zip"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 --check
          ditto -x -k "$archive" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version | grep -Fq "$XCODEGEN_VERSION"

      - name: Regenerate Xcode project and verify target inventory
        shell: bash
        run: |
          set -euo pipefail

          committed_inventory="$RUNNER_TEMP/committed-project.json"
          generated_inventory="$RUNNER_TEMP/generated-project.json"
          xcodebuild -list -json -project Primuse.xcodeproj > "$committed_inventory"
          xcodegen generate --spec project.yml
          xcodebuild -list -json -project Primuse.xcodeproj > "$generated_inventory"
          python3 - "$committed_inventory" "$generated_inventory" <<'PY'
          import json
          import sys

          def inventory(path):
              with open(path, encoding="utf-8") as source:
                  project = json.load(source)["project"]
              return {
                  key: sorted(project.get(key, []))
                  for key in ("targets", "schemes", "configurations")
              }

          committed = inventory(sys.argv[1])
          generated = inventory(sys.argv[2])
          if committed != generated:
              print("Committed and generated Xcode project inventories differ.")
              print("Committed:", json.dumps(committed, indent=2))
              print("Generated:", json.dumps(generated, indent=2))
              raise SystemExit(1)
          print("XcodeGen target, scheme, and configuration inventories match.")
          print(json.dumps(generated, indent=2))
          PY

      - name: Resolve locked Swift packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project Primuse.xcodeproj \
            -scheme Primuse \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile
          git diff --exit-code -- \
            Primuse.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            PrimuseKit/Package.resolved

      - name: Verify standard Release configuration keeps CloudKit enabled
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -showBuildSettings \
            -project Primuse.xcodeproj \
            -scheme Primuse \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            > "$RUNNER_TEMP/ios-release-build-settings.txt"
          grep -Fq 'PRIMUSE_CLOUDKIT_MODE = standard' \
            "$RUNNER_TEMP/ios-release-build-settings.txt"
          if grep -Fq 'PRIMUSE_CLOUDKIT_DISABLED_FOR_UNSIGNED_PROTOTYPE' \
            "$RUNNER_TEMP/ios-release-build-settings.txt"; then
            echo 'The standard Release configuration must not define the unsigned prototype CloudKit gate.' >&2
            exit 1
          fi
          echo 'The standard Release configuration does not define the prototype CloudKit disable condition.'

      - name: Run CloudKit runtime tests on iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -showdestinations \
            -project Primuse.xcodeproj \
            -scheme Primuse > "$RUNNER_TEMP/ios-test-destinations.txt"
          simulator_id=$(python3 - "$RUNNER_TEMP/ios-test-destinations.txt" <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()
          match = re.search(
              r"\{\s*platform:iOS Simulator,\s*arch:[^,]+,\s*id:([^,]+),\s*OS:[^,]+,\s*name:iPhone[^}]*\}",
              text,
          )
          if not match:
              print("No available iPhone Simulator destination was reported by Xcode.", file=sys.stderr)
              print(text, file=sys.stderr)
              raise SystemExit(1)
          print(match.group(1).strip())
          PY
          )
          echo "Running focused CloudKit tests on Simulator $simulator_id"
          xcodebuild test \
            -project Primuse.xcodeproj \
            -scheme Primuse \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/PrimuseSimulatorTests" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            -only-testing:PrimuseTests/CloudKitRuntimeTests \
            CODE_SIGNING_ALLOWED=NO \
            PRIMUSE_CLOUDKIT_MODE=disabled-for-unsigned-prototype \
            PRIMUSE_CLOUDKIT_COMPILATION_CONDITION=PRIMUSE_CLOUDKIT_DISABLED_FOR_UNSIGNED_PROTOTYPE \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-cloudkit-ios-tests.log"

      - name: Run CloudKit runtime tests on macOS
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Primuse.xcodeproj \
            -scheme PrimuseMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/PrimuseMacTests" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            -only-testing:PrimuseMacTests/CloudKitRuntimeTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-cloudkit-macos-tests.log"

      - name: Build iOS Device Debug without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Primuse.xcodeproj \
            -scheme Primuse \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PrimuseDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PRIMUSE_CLOUDKIT_MODE=disabled-for-unsigned-prototype \
            PRIMUSE_CLOUDKIT_COMPILATION_CONDITION=PRIMUSE_CLOUDKIT_DISABLED_FOR_UNSIGNED_PROTOTYPE \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-build.log"

      - name: Verify app bundle and attempt unsigned archive
        id: package
        shell: bash
        run: |
          set -euo pipefail

          derived_app="$RUNNER_TEMP/PrimuseDerivedData/Build/Products/Debug-iphoneos/Primuse.app"
          test -d "$derived_app"
          test -f "$derived_app/Info.plist"

          verify_bundle() {
            local bundle="$1" expected_bundle_id="$2" require_arm64="$3"
            local bundle_id executable architectures
            test -d "$bundle"
            test -f "$bundle/Info.plist"
            bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist")
            test "$bundle_id" = "$expected_bundle_id"
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Info.plist")
            test -x "$bundle/$executable"
            if test "$require_arm64" = true; then
              lipo -verify_arch arm64 "$bundle/$executable"
            else
              architectures=$(lipo -archs "$bundle/$executable")
              test -n "$architectures"
              printf 'Verified %s architecture(s): %s\n' "$bundle" "$architectures"
            fi
            printf 'Verified bundle %s: %s\n' "$bundle" "$bundle_id"
          }

          verify_app() {
            local app="$1"
            local bundle_id executable extension_root extension_count watch_apps framework_path framework_executable
            local framework_count framework_architectures count cloudkit_mode
            verify_bundle "$app" 'com.welape.yuanyin' true
            bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
            cloudkit_mode=$(/usr/libexec/PlistBuddy -c 'Print :PrimuseCloudKitMode' "$app/Info.plist")
            test "$cloudkit_mode" = 'disabled-for-unsigned-prototype'
            printf 'Verified main app CloudKit mode: %s\n' "$cloudkit_mode"

            verify_bundle "$app/PlugIns/PrimuseWidgetExtension.appex" 'com.welape.yuanyin.widget' true
            verify_bundle "$app/Extensions/PrimuseKaraokeModelDownloader.appex" 'com.welape.yuanyin.karaokemodel' true
            verify_bundle "$app/Watch/PrimuseWatchApp.app" 'com.welape.yuanyin.watchkitapp' false
            verify_bundle "$app/Watch/PrimuseWatchApp.app/PlugIns/PrimuseWatchWidgets.appex" \
              'com.welape.yuanyin.watchkitapp.widgets' false

            framework_count=0
            while IFS= read -r -d '' framework_path; do
              test -f "$framework_path/Info.plist"
              framework_executable=$(/usr/libexec/PlistBuddy \
                -c 'Print :CFBundleExecutable' "$framework_path/Info.plist")
              if [[ "$framework_path" == "$app/Watch/"* ]]; then
                framework_architectures=$(lipo -archs "$framework_path/$framework_executable")
                test -n "$framework_architectures"
                printf 'Verified framework %s architecture(s): %s\n' \
                  "$framework_path" "$framework_architectures"
              else
                lipo -verify_arch arm64 "$framework_path/$framework_executable"
              fi
              framework_count=$((framework_count + 1))
            done < <(find "$app" -type d -name '*.framework' -print0)
            test "$framework_count" -gt 0

            extension_count=0
            for extension_root in "$app/PlugIns" "$app/Extensions"; do
              if test -d "$extension_root"; then
                count=$(find "$extension_root" -maxdepth 1 -type d -name '*.appex' | wc -l | tr -d ' ')
                extension_count=$((extension_count + count))
              fi
            done
            watch_apps=$(find "$app/Watch" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')
            test "$extension_count" -ge 2
            test "$watch_apps" -ge 1
            printf 'Verified %s: bundle=%s, executable=%s, embedded extensions=%s, watch apps=%s\n' \
              "$app" "$bundle_id" "$executable" "$extension_count" "$watch_apps"

            haptics_declared=false
            if grep -Eq '^[[:space:]]*MusicHapticsSupported:[[:space:]]*true([[:space:]]*(#.*)?)?$' project.yml \
              || /usr/libexec/PlistBuddy -c 'Print :MusicHapticsSupported' Primuse/Info.plist 2>/dev/null | grep -Fxq 'true'; then
              haptics_declared=true
            fi

            if value=$(/usr/libexec/PlistBuddy -c 'Print :MusicHapticsSupported' "$app/Info.plist" 2>/dev/null); then
              test "$value" = 'true'
              echo 'MusicHapticsSupported=true is present in the built app Info.plist.'
            elif test "$haptics_declared" = true; then
              echo 'MusicHapticsSupported is declared by the project but missing from the built app Info.plist.' >&2
              return 1
            else
              echo 'MusicHapticsSupported is not declared in this preflight build.'
            fi
          }

          verify_app "$derived_app"

          archive_path="$RUNNER_TEMP/Primuse-unsigned.xcarchive"
          archive_kind='unsigned-xcarchive-application'
          payload_source="$archive_path"
          payload_name='Primuse-Debug-iOS-unsigned.xcarchive.zip'

          xcodebuild archive \
            -project Primuse.xcodeproj \
            -scheme Primuse \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -derivedDataPath "$RUNNER_TEMP/PrimuseDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PRIMUSE_CLOUDKIT_MODE=disabled-for-unsigned-prototype \
            PRIMUSE_CLOUDKIT_COMPILATION_CONDITION=PRIMUSE_CLOUDKIT_DISABLED_FOR_UNSIGNED_PROTOTYPE \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-archive.log"
          archived_app="$archive_path/Products/Applications/Primuse.app"
          test -d "$archived_app"
          test -f "$archive_path/Info.plist"
          verify_app "$archived_app"
          archive_bundle_id=$(/usr/libexec/PlistBuddy \
            -c 'Print :ApplicationProperties:CFBundleIdentifier' "$archive_path/Info.plist")
          test "$archive_bundle_id" = 'com.welape.yuanyin'

          artifact_dir="$RUNNER_TEMP/primuse-artifact"
          mkdir -p "$artifact_dir"
          payload="$artifact_dir/$payload_name"
          ditto -c -k --sequesterRsrc --keepParent "$payload_source" "$payload"
          unzip -tq "$payload"
          zipinfo -1 "$payload" | grep -F 'Primuse.app/Info.plist' >/dev/null

          sha256=$(shasum -a 256 "$payload" | awk '{print $1}')
          size_bytes=$(stat -f '%z' "$payload")
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$derived_app/Info.plist")
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$derived_app/Info.plist")
          ios_sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          xcodegen_version=$(xcodegen --version | tail -n 1)

          cat > "$artifact_dir/manifest.json" <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "runner_label": "xcode-27",
            "runner_architecture": "$(uname -m)",
            "macos_version": "$(sw_vers -productVersion)",
            "xcode_version": "${XCODE_VERSION}",
            "xcode_build": "${XCODE_BUILD}",
            "ios_sdk": "${ios_sdk}",
            "xcodegen_version": "${xcodegen_version}",
            "configuration": "Debug",
            "destination": "generic/platform=iOS",
            "cloudkit_mode": "disabled-for-unsigned-prototype",
            "code_signing_allowed": false,
            "bundle_identifier": "${bundle_id}",
            "executable": "${executable}",
            "package_kind": "${archive_kind}",
            "payload": "${payload_name}",
            "payload_size_bytes": ${size_bytes},
            "payload_sha256": "${sha256}"
          }
          EOF

          echo "payload=$payload" >> "$GITHUB_OUTPUT"
          echo "manifest=$artifact_dir/manifest.json" >> "$GITHUB_OUTPUT"
          {
            echo '## Unsigned iOS Device build'
            echo
            printf '%s\n' "- Commit: $GITHUB_SHA"
            printf '%s\n' "- Toolchain: Xcode $XCODE_VERSION ($XCODE_BUILD), iOS SDK $ios_sdk, XcodeGen $xcodegen_version"
            printf '%s\n' "- Product: $payload_name ($archive_kind), Bundle ID $bundle_id"
            printf '%s\n' '- CloudKit: disabled-for-unsigned-prototype'
            printf '%s\n' "- Size: $size_bytes bytes"
            printf '%s\n' "- SHA-256: $sha256"
            echo '- Signing: disabled; this is not an IPA and cannot be installed as downloaded.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signing handoff artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: primuse-ios-device-debug-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.payload }}
            ${{ steps.package.outputs.manifest }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
