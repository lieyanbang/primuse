name: MusicHapticsProbe
options:
  bundleIdPrefix: com.welape.primuse
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

schemes:
  MusicHapticsProbe:
    build:
      targets:
        MusicHapticsProbe: all
    run:
      config: Debug
      executable: MusicHapticsProbe
    archive:
      config: Debug
    test:
      targets:
        - MusicHapticsProbeTests

targets:
  MusicHapticsProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welape.primuse.musichapticsprobe
        PRODUCT_NAME: MusicHapticsProbe
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: MediaAccessibility.framework
      - sdk: MediaPlayer.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: UIKit.framework
  MusicHapticsProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MusicHapticsProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welape.primuse.musichapticsprobe.tests
        PRODUCT_NAME: MusicHapticsProbeTests
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MusicHapticsProbe.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MusicHapticsProbe"
        BUNDLE_LOADER: "$(TEST_HOST)"
